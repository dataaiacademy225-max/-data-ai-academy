# Déploiement sur un serveur (VPS) : base de données, migrations, application et worker.
# 1. Copier .env.example en .env.production et le remplir (secrets forts, BETTER_AUTH_URL en https).
# 2. docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# 3. Placer devant un proxy inverse HTTPS (Caddy, Nginx, ou celui de l'hébergeur) qui ajoute l'adresse
#    du visiteur à droite de X-Forwarded-For (TRUSTED_PROXY_COUNT=1 : un seul proxy devant l'application).

x-app: &app
  build: .
  env_file: .env.production
  environment:
    DATABASE_URL: postgresql://${POSTGRES_USER:-cite}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@db:5432/${POSTGRES_DB:-cite_audit}
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cite}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-cite_audit}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    # Pas de port exposé : la base n'est joignable que par l'application et le worker.

  migrate:
    <<: *app
    command: ["pnpm", "db:deploy"]
    restart: "no"

  web:
    <<: *app
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      # Écoute locale uniquement : le proxy inverse HTTPS est le seul point d'entrée public.
      - "127.0.0.1:3000:3000"

  worker:
    <<: *app
    init: true
    command: ["node", "--import", "tsx", "--conditions=react-server", "src/worker/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    # Laisse le temps de finir l'audit en cours avant l'arrêt.
    stop_grace_period: 3m

volumes:
  pgdata:
