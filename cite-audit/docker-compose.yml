services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cite
      POSTGRES_PASSWORD: cite
      POSTGRES_DB: cite_audit
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
