# Vérifications automatiques de GriotCite à chaque push et pull request touchant cite-audit/.
# Aucun secret requis : base PostgreSQL jetable, aucun appel à Internet pendant les tests.
name: GriotCite CI

on:
  push:
    paths: ["cite-audit/**", ".github/workflows/cite-audit-ci.yml"]
  pull_request:
    paths: ["cite-audit/**", ".github/workflows/cite-audit-ci.yml"]

permissions:
  contents: read

concurrency:
  group: cite-audit-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cite-audit

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cite
          POSTGRES_PASSWORD: cite
          POSTGRES_DB: cite_audit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cite -d cite_audit_test"
          --health-interval 5s
          --health-retries 10
    env:
      # Valeurs factices propres à la CI (aucune donnée réelle).
      DATABASE_URL: postgresql://cite:cite@localhost:5432/cite_audit_ci_unused
      TEST_DATABASE_URL: postgresql://cite:cite@localhost:5432/cite_audit_test
      BETTER_AUTH_SECRET: ci-secret-factice-de-plus-de-32-caracteres
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: cite-audit/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: cite-audit/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:integration
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image (sans la publier)
        run: docker build -t cite-audit:ci .
